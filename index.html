<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MediaPipe Hands + Posture + micro:bit</title>
<style>
body { text-align: center; font-family: sans-serif; margin: 10px; }
video, canvas { width: 45%; margin: 5px; border: 1px solid #333; vertical-align: top; }
#status { color: blue; font-size: 18px; }
#action { color: red; font-size: 28px; font-weight: bold; }
.slider-container { margin: 5px 0; }
</style>
</head>
<body>

<h2>MediaPipe Hands + Posture → micro:bit</h2>
<div id="status">初始化...</div>
<div id="action">等待动作...</div>
<button id="connectBtn">连接 micro:bit</button>
<br>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="slider-container">
    <label>手指方向强度阈值 (dirThreshold): <span id="moveVal">0.05</span></label><br>
    <input type="range" id="moveSlider" min="0.02" max="0.20" step="0.01" value="0.05">
</div>
<div class="slider-container">
    <label>连续帧数 (framesNeeded): <span id="frameVal">2</span></label><br>
    <input type="range" id="frameSlider" min="1" max="5" step="1" value="2">
</div>
<div class="slider-container">
    <label>冷却时间(ms): <span id="coolVal">150</span></label><br>
    <input type="range" id="coolSlider" min="50" max="500" step="10" value="150">
</div>

<script type="module">
import { HandLandmarker, PoseLandmarker, FilesetResolver, DrawingUtils } 
    from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

const statusEl = document.getElementById("status");
const actionEl = document.getElementById("action");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const connectBtn = document.getElementById("connectBtn");

let port, writer;

// 参数
let dirThreshold = parseFloat(document.getElementById("moveSlider").value);
let framesNeeded = parseInt(document.getElementById("frameSlider").value);
let cooldown = parseInt(document.getElementById("coolSlider").value);

document.getElementById("moveSlider").addEventListener("input", e=>{
    dirThreshold = parseFloat(e.target.value);
    document.getElementById("moveVal").textContent = dirThreshold.toFixed(2);
});
document.getElementById("frameSlider").addEventListener("input", e=>{
    framesNeeded = parseInt(e.target.value);
    document.getElementById("frameVal").textContent = framesNeeded;
});
document.getElementById("coolSlider").addEventListener("input", e=>{
    cooldown = parseInt(e.target.value);
    document.getElementById("coolVal").textContent = cooldown;
});

document.getElementById("moveVal").textContent  = dirThreshold.toFixed(2);
document.getElementById("frameVal").textContent = framesNeeded;
document.getElementById("coolVal").textContent  = cooldown;

// USB 连接
connectBtn.addEventListener("click", async () => {
    try {
        if (!("serial" in navigator)) {
            statusEl.textContent = "当前浏览器不支持 Web Serial，请使用桌面版 Chrome";
            return;
        }
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        connectBtn.disabled = true;
        statusEl.textContent = "micro:bit 已连接（USB）";
    } catch (e) {
        statusEl.textContent = "连接失败：" + e;
        console.error(e);
    }
});

// 手势闭环
let currentAction = null, actionCounter = 0, lastSent = 0, lastSentAction = null;

// 姿势闭环
let currentPosture = null, postureCounter = 0, lastSentPosture = 0;

async function sendAction(a) {
    if (!writer) return;
    let msg = "0";
    if (a==="LEFT") msg="L";
    else if (a==="RIGHT") msg="R";
    else if (a==="UP") msg="U";
    else if (a==="DOWN") msg="D";
    else if (a==="RESET") msg="F";
    await writer.write(new TextEncoder().encode(msg + "\n"));
}

async function sendPosture(msg){
    if (!writer) return;
    await writer.write(new TextEncoder().encode(msg+"\n"));
}

// 模型
let handLandmarker, poseLandmarker;

async function init() {
    statusEl.textContent = "加载模型...";
    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
    );

    // 手势模型
    handLandmarker = await HandLandmarker.createFromOptions(vision,{
        baseOptions:{modelAssetPath:"https://raw.githubusercontent.com/paulwang999/ethan-hand-arm-posture-demo/main/hand_landmarker.task"},
        runningMode:"VIDEO",
        numHands:1
    });

    // 姿势模型
    poseLandmarker = await PoseLandmarker.createFromOptions(vision,{
        baseOptions:{modelAssetPath:"https://raw.githubusercontent.com/paulwang999/ethan-hand-arm-posture-demo/main/pose_landmarker_lite.task"},
        runningMode:"VIDEO",
        numPoses:1
    });

    console.log("poseLandmarker object:", poseLandmarker);

    statusEl.textContent = "模型加载完成，启动摄像头...";
    startCamera();
}

function startCamera() {
    navigator.mediaDevices.getUserMedia({video:true})
    .then(stream=>{
        video.srcObject=stream;
        video.onloadedmetadata=()=>{
            video.play();
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            statusEl.textContent = "摄像头已启动";
            requestAnimationFrame(loop);
        };
    })
    .catch(err=>{
        statusEl.textContent = "无法访问摄像头：" + err;
        console.error(err);
    });
}

// 简单站立/蹲下判定
function getPosture(lm){
    // 使用左右髋膝踝关键点
    const hipY = (lm[23].y + lm[24].y)/2;
    const kneeY = (lm[25].y + lm[26].y)/2;
    const kneeHipDist = kneeY - hipY;
    if (kneeHipDist>0.25) return "SQUAT";
    return "STAND";
}

async function loop(timestamp){
    if(!handLandmarker) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // 手势
    const results = await handLandmarker.detectForVideo(video, timestamp);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    if(results.landmarks && results.landmarks.length>0){
        const lm = results.landmarks[0];
        const draw = new DrawingUtils(ctx);
        draw.drawConnectors(lm, HandLandmarker.HAND_CONNECTIONS);
        draw.drawLandmarks(lm);

        const wrist=lm[0], tip=lm[8];
        const vx=tip.x-wrist.x, vy=tip.y-wrist.y;
        const len=Math.hypot(vx,vy);
        const dIndex=Math.hypot(lm[8].x-wrist.x,lm[8].y-wrist.y,lm[8].z-wrist.z);
        const dMiddle=Math.hypot(lm[12].x-wrist.x,lm[12].y-wrist.y,lm[12].z-wrist.z);
        const dRing=Math.hypot(lm[16].x-wrist.x,lm[16].y-wrist.y,lm[16].z-wrist.z);
        const dPinky=Math.hypot(lm[20].x-wrist.x,lm[20].y-wrist.y,lm[20].z-wrist.z);
        const fistThreshold=0.12;
        const isFist=dIndex<fistThreshold && dMiddle<fistThreshold && dRing<fistThreshold && dPinky<fistThreshold;

        let detected=null;
        if(isFist) detected="RESET";
        else if(len>dirThreshold){
            if(Math.abs(vx)>Math.abs(vy)) detected=vx>0?"LEFT":"RIGHT";
            else detected=vy>0?"DOWN":"UP";
        }

        if(detected===currentAction) actionCounter++;
        else if(detected){ currentAction=detected; actionCounter=1; }
        else { currentAction=null; actionCounter=0; }

        const now=performance.now();
        if(currentAction && currentAction!==lastSentAction && actionCounter>=framesNeeded && now-lastSent>cooldown){
            actionEl.textContent=currentAction;
            await sendAction(currentAction);
            lastSent=now;
            lastSentAction=currentAction;
        }else if(!currentAction && now-lastSent>300){
            actionEl.textContent="WAIT";
            lastSentAction=null;
        }
    }else{
        actionEl.textContent="没有检测到手";
        currentAction=null;
        actionCounter=0;
    }

    // 姿势
    if(poseLandmarker){
        const poseResults=await poseLandmarker.detectForVideo(video,timestamp);
        if(poseResults && poseResults.landmarks.length>0){
            const posture=getPosture(poseResults.landmarks[0]);
            if(posture===currentPosture) postureCounter++;
            else { currentPosture=posture; postureCounter=1; }

            if(postureCounter>=framesNeeded && performance.now()-lastSentPosture>cooldown){
                const msg=posture==="STAND"?"1":"2";
                await sendPosture(msg);
                lastSentPosture=performance.now();
                console.log("Sent posture:",posture,msg);
            }
        }else{
            currentPosture=null;
            postureCounter=0;
        }
    }

    requestAnimationFrame(loop);
}

window.addEventListener("load",init);
</script>

</body>
</html>
