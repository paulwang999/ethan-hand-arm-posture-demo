<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand + Pose Recognition Demo</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; display: flex; gap:16px; padding:12px;}
    video, canvas { border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.6); }
    video { transform: scaleX(-1); }
    .badge { background:#222; padding:6px 8px; border-radius:6px; margin-top:4px;}
    #log { width:380px; max-height:720px; overflow:auto; padding:8px; background:#0b0b0b; border-radius:8px;}
  </style>
</head>
<body>
  <div>
    <button id="startBtn">启动相机</button>
    <button id="stopBtn" disabled>停止</button><br>
    <video id="video" width="640" height="480" autoplay muted playsinline></video>
    <canvas id="canvas" width="640" height="480" style="position:absolute;top:0;left:0"></canvas>
    <div class="badge" id="handLabel">Hand: —</div>
    <div class="badge" id="poseLabel">Pose: —</div>
    <div class="badge" id="spatialLabel">Spatial: —</div>
  </div>
  <div id="log">
    <h3>Events</h3>
    <div id="events"></div>
  </div>

  <!-- ES Module 加载 MediaPipe Tasks Vision -->
  <script type="module">
    import { FilesetResolver, HandLandmarker, PoseLandmarker } from 'https://unpkg.com/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const handLabel = document.getElementById('handLabel');
    const poseLabel = document.getElementById('poseLabel');
    const spatialLabel = document.getElementById('spatialLabel');
    const eventsDiv = document.getElementById('events');

    let running = false;
    let handLandmarker, poseLandmarker;

    async function initModels() {
      const vision = await FilesetResolver.forVisionTasks('https://unpkg.com/@mediapipe/tasks-vision@0.10.21/wasm/');
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: 'hand_landmarker.task' },
        numHands: 2
      });
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: 'pose_landmarker_lite.task' },
        runningMode: 'VIDEO'
      });
    }

    startBtn.onclick = async () => {
      if(running) return;
      const stream = await navigator.mediaDevices.getUserMedia({ video:{width:640,height:480}, audio:false });
      video.srcObject = stream;
      await video.play();
      running = true;
      startBtn.disabled = true; stopBtn.disabled = false;
      if(!handLandmarker || !poseLandmarker) await initModels();
      requestAnimationFrame(processFrame);
    };

    stopBtn.onclick = () => {
      if(!running) return;
      video.srcObject.getTracks().forEach(t => t.stop());
      running = false;
      startBtn.disabled = false; stopBtn.disabled = true;
    };

    async function processFrame(){
      if(!running) return;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(video,0,0,canvas.width,canvas.height);

      const handResults = await handLandmarker.detectForVideo(video);
      const poseResults = await poseLandmarker.detectForVideo(video);

      if(handResults?.landmarks?.length>0){
        const gesture = recognizeHandGesture(handResults.landmarks[0]);
        handLabel.textContent = 'Hand: '+gesture.name;

        const cx = average(handResults.landmarks[0].map(p=>p.x))*canvas.width;
        const cy = average(handResults.landmarks[0].map(p=>p.y))*canvas.height;
        const s = spatialPosition(cx,cy);
        spatialLabel.textContent = s;

        emitEvent('hand:'+gesture.name);
        emitEvent('spatial:'+s);
      } else {
        handLabel.textContent='Hand: —';
        spatialLabel.textContent='—';
      }

      if(poseResults?.landmarks?.length>0){
        const p = classifyPose(poseResults.landmarks);
        poseLabel.textContent='Pose: '+p.pose;
        emitEvent('pose:'+p.pose);
      } else {
        poseLabel.textContent='Pose: —';
      }

      requestAnimationFrame(processFrame);
    }

    function average(arr){return arr.reduce((a,b)=>a+b,0)/arr.length;}
    function spatialPosition(cx,cy){
      const w=canvas.width,h=canvas.height;
      const marginX=w*0.2,marginY=h*0.2;
      if(cy<marginY) return 'UP';
      if(cy>h-marginY) return 'DOWN';
      if(cx<marginX) return 'LEFT';
      if(cx>w-marginX) return 'RIGHT';
      return 'CENTER';
    }
    function emitEvent(msg){
      const d=document.createElement('div'); d.textContent=msg;
      eventsDiv.prepend(d);
    }

    // 手势识别（open_palm, fist, pointing, thumbs_up, ok, call）
    function recognizeHandGesture(landmarks){
      const tips=[8,12,16,20], pip=[6,10,14,18];
      const extended=[];
      for(let i=0;i<tips.length;i++){extended.push(landmarks[tips[i]].y<landmarks[pip[i]].y);}
      const thumbTip=landmarks[4], thumbIp=landmarks[3];
      const isThumbExt=Math.abs(thumbTip.x-thumbIp.x)>0.03;
      const distIdxThumb=Math.hypot(landmarks[8].x-thumbTip.x, landmarks[8].y-thumbTip.y);
      const wrist=landmarks[0];
      const avgFingerDist=average([8,12,16,20].map(i=>Math.hypot(landmarks[i].x-wrist.x, landmarks[i].y-wrist.y)));
      if(distIdxThumb<0.04) return {name:'ok'};
      if(extended[0]&&!extended[1]&&!extended[2]&&!extended[3]) return {name:'pointing'};
      if(extended.every(x=>x)&&isThumbExt&&avgFingerDist>0.12) return {name:'open_palm'};
      if(!extended.some(x=>x)&&!isThumbExt) return {name:'fist'};
      if(isThumbExt && thumbTip.y<landmarks[2].y&&!extended.some(x=>x)) return {name:'thumbs_up'};
      if(isThumbExt && extended[3]&&!extended[0]&&!extended[1]&&!extended[2]) return {name:'call'};
      return {name:'unknown'};
    }

    // 姿势识别（standing, squatting, bending, lean-left/right, arms-up/down, hand-on-head）
    function classifyPose(lms){
      const lshoulder=lms[11], rshoulder=lms[12], lhip=lms[23], rhip=lms[24];
      const lknee=lms[25], rknee=lms[26], lwrist=lms[15], rwrist=lms[16];
      const head=lms[0];
      if(!lshoulder||!rshoulder||!lhip||!rhip) return {pose:'unknown'};
      const shoulderY=(lshoulder.y+rshoulder.y)/2, hipY=(lhip.y+rhip.y)/2, kneeY=(lknee.y+rknee.y)/2;
      const leaningLeft=lshoulder.x>lhip.x+0.08, leaningRight=rshoulder.x<rhip.x-0.08;
      if(Math.abs(shoulderY-hipY)<0.15){if(leaningLeft) return {pose:'lean-left'}; if(leaningRight) return {pose:'lean-right'}; return {pose:'standing'};}
      if(hipY>shoulderY+0.15 && kneeY<hipY-0.15) return {pose:'bending'};
      if(hipY>shoulderY+0.2 && kneeY>hipY-0.1) return {pose:'squatting'};
      const leftHandOnHead=lwrist&&head&&lwrist.y<head.y+0.05, rightHandOnHead=rwrist&&head&&rwrist.y<head.y+0.05;
      if(leftHandOnHead||rightHandOnHead) return {pose:'hand-on-head'};
      const leftArmUp=lwrist&&lwrist.y<lshoulder.y-0.1, rightArmUp=rwrist&&rwrist.y<rshoulder.y-0.1;
      if(leftArmUp||rightArmUp) return {pose:'arms-up'};
      const leftArmDown=lwrist&&lwrist.y>lshoulder.y+0.1, rightArmDown=rwrist&&rwrist.y>rshoulder.y+0.1;
      if(leftArmDown||rightArmDown) return {pose:'arms-down'};
      return {pose:'unknown'};
    }

  </script>
</body>
</html>
