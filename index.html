<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PoseLandmarker Lite Demo</title>
<style>
  body { text-align: center; font-family: sans-serif; margin: 10px; background: #111; color: #eee; }
  video, canvas { width: 60%; margin: 5px; border: 1px solid #333; vertical-align: top; }
  #status, #poseLabel { font-size: 20px; margin: 6px; display: block; }
</style>
</head>
<body>

<h2>MediaPipe Pose Recognition Demo</h2>
<div id="status">初始化...</div>
<div id="poseLabel">Pose: —</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

// DOM 元素
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const poseLabel = document.getElementById("poseLabel");

let poseLandmarker;

// 简单姿势分类函数
function classifyPose(lms){
  if(!lms || lms.length<33) return 'UNKNOWN';

  const lshoulder=lms[11], rshoulder=lms[12], lhip=lms[23], rhip=lms[24];
  const lknee=lms[25], rknee=lms[26], lwrist=lms[15], rwrist=lms[16], head=lms[0];

  if(!lshoulder || !rshoulder || !lhip || !rhip) return 'UNKNOWN';

  const shoulderY = (lshoulder.y + rshoulder.y)/2;
  const hipY = (lhip.y + rhip.y)/2;
  const kneeY = (lknee.y + rknee.y)/2;

  const leaningLeft = lshoulder.x > lhip.x + 0.05;
  const leaningRight = rshoulder.x < rhip.x - 0.05;
  const leftArmUp = lwrist && lwrist.y < lshoulder.y - 0.1;
  const rightArmUp = rwrist && rwrist.y < rshoulder.y - 0.1;
  const leftArmDown = lwrist && lwrist.y > lshoulder.y + 0.1;
  const rightArmDown = rwrist && rwrist.y > rshoulder.y + 0.1;
  const leftHandOnHead = lwrist && lwrist.y < head.y + 0.05;
  const rightHandOnHead = rwrist && rwrist.y < head.y + 0.05;

  if(leftHandOnHead || rightHandOnHead) return 'HAND_ON_HEAD';
  if(leftArmUp || rightArmUp) return 'ARMS_UP';
  if(leftArmDown || rightArmDown) return 'ARMS_DOWN';
  if(leaningLeft) return 'LEAN_LEFT';
  if(leaningRight) return 'LEAN_RIGHT';
  if(hipY > shoulderY + 0.15 && kneeY > hipY - 0.05) return 'SQUATTING';

  return 'STANDING';
}

// 初始化模型
async function initPose() {
  statusEl.textContent = "加载模型...";
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");

  poseLandmarker = await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/pose_landmarker_lite.task"
    },
    runningMode:"VIDEO"
  });

  statusEl.textContent = "模型加载完成，启动摄像头...";
  startCamera();
}

// 启动摄像头
function startCamera(){
  navigator.mediaDevices.getUserMedia({ video:true })
    .then(stream=>{
      video.srcObject = stream;
      video.onloadedmetadata=()=>{ video.play(); requestAnimationFrame(loop); }
    })
    .catch(err=>{
      statusEl.textContent="无法访问摄像头："+err;
      console.error(err);
    });
}

// 主循环
async function loop(timestamp){
  if(!poseLandmarker) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(video,0,0,canvas.width,canvas.height);

  const poseResults = await poseLandmarker.detectForVideo(video, timestamp);

  if(poseResults?.landmarks?.length>0){
    const draw = new DrawingUtils(ctx);

    // 绘制关键点
    draw.drawLandmarks([poseResults.landmarks]);

    // 绘制骨架连接
    const connections=[
      [11,13],[13,15],[12,14],[14,16],
      [11,12],[23,25],[25,27],[24,26],[26,28],
      [23,24],[11,23],[12,24]
    ];
    connections.forEach(c=>{
      const [i,j]=c;
      if(poseResults.landmarks[i] && poseResults.landmarks[j])
        draw.drawConnectors([poseResults.landmarks[i], poseResults.landmarks[j]], [[0,1]]);
    });

    poseLabel.textContent = 'Pose: '+classifyPose(poseResults.landmarks);
  } else {
    poseLabel.textContent='Pose: —';
  }

  requestAnimationFrame(loop);
}

window.addEventListener("load", initPose);
</script>

</body>
</html>
