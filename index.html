<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TF.js Hands + Posture Demo → micro:bit</title>
<style>
body { text-align: center; font-family: sans-serif; margin: 10px; }
video, canvas { width: 45%; margin: 5px; border: 1px solid #333; vertical-align: top; }
#status { color: blue; font-size: 18px; }
#action { color: red; font-size: 28px; font-weight: bold; }
#posture { color: green; font-size: 24px; font-weight: bold; margin-top: 5px; }
</style>
</head>
<body>

<h2>TF.js Hands + Multi-Posture → micro:bit</h2>
<div id="status">初始化...</div>
<div id="action">等待手势...</div>
<div id="posture">等待姿势...</div>
<button id="connectBtn">连接 micro:bit</button>
<br>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script>
const statusEl = document.getElementById("status");
const actionEl = document.getElementById("action");
const postureEl = document.getElementById("posture");
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const connectBtn = document.getElementById("connectBtn");

let port, writer;

// 手势闭环
let currentAction = null, actionCounter = 0, lastSent = 0, lastSentAction = null;
// 姿势闭环
let currentPosture = null, postureCounter = 0, lastSentPosture = 0;

// USB micro:bit
connectBtn.addEventListener("click", async () => {
    try {
        if (!("serial" in navigator)) {
            statusEl.textContent = "当前浏览器不支持 Web Serial，请使用桌面版 Chrome";
            return;
        }
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        connectBtn.disabled = true;
        statusEl.textContent = "micro:bit 已连接（USB）";
    } catch (e) {
        statusEl.textContent = "连接失败：" + e;
        console.error(e);
    }
});

async function sendAction(a){
    if(!writer) return;
    let msg="0";
    if(a==="LEFT") msg="L";
    else if(a==="RIGHT") msg="R";
    else if(a==="UP") msg="U";
    else if(a==="DOWN") msg="D";
    else if(a==="RESET") msg="F";
    await writer.write(new TextEncoder().encode(msg+"\n"));
}
async function sendPosture(msg){
    if(!writer) return;
    await writer.write(new TextEncoder().encode(msg+"\n"));
}

// 模型
let handModel, poseModel;

async function init(){
    statusEl.textContent = "加载手势模型...";
    handModel = await handpose.load();
    statusEl.textContent = "加载姿势模型...";
    poseModel = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet);
    statusEl.textContent = "模型加载完成，启动摄像头...";

    // 启动摄像头
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
    await new Promise(resolve => video.onloadedmetadata = resolve);
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    statusEl.textContent = "摄像头已启动";
    requestAnimationFrame(loop);
}

// 手势检测
function detectHandGesture(keypoints){
    const wrist = keypoints[0];
    const tip = keypoints[8];
    const vx = tip[0]-wrist[0], vy = tip[1]-wrist[1];
    const len = Math.hypot(vx,vy);

    let dIndex = Math.hypot(keypoints[8][0]-wrist[0], keypoints[8][1]-wrist[1]);
    let dMiddle = Math.hypot(keypoints[12][0]-wrist[0], keypoints[12][1]-wrist[1]);
    let dRing = Math.hypot(keypoints[16][0]-wrist[0], keypoints[16][1]-wrist[1]);
    let dPinky = Math.hypot(keypoints[20][0]-wrist[0], keypoints[20][1]-wrist[1]);
    const fistThreshold=30;

    if(dIndex<fistThreshold && dMiddle<fistThreshold && dRing<fistThreshold && dPinky<fistThreshold) return "RESET";
    if(len>50){
        if(Math.abs(vx)>Math.abs(vy)) return vx>0?"LEFT":"RIGHT";
        else return vy>0?"DOWN":"UP";
    }
    return null;
}

// 姿势检测
function detectPosture(keypoints){
    const leftHip = keypoints[11];
    const rightHip = keypoints[12];
    const leftKnee = keypoints[13];
    const rightKnee = keypoints[14];
    const leftShoulder = keypoints[5];
    const rightShoulder = keypoints[6];
    const leftWrist = keypoints[9];
    const rightWrist = keypoints[10];
    const nose = keypoints[0];

    const hipY = (leftHip[1]+rightHip[1])/2;
    const kneeY = (leftKnee[1]+rightKnee[1])/2;
    const shoulderY = (leftShoulder[1]+rightShoulder[1])/2;

    if(kneeY - hipY > 50) return "SQUAT";
    if(leftWrist[1]<shoulderY && rightWrist[1]<shoulderY) return "HANDS_UP";
    const headY = nose[1];
    if(Math.abs(leftWrist[1]-headY)<30 && Math.abs(rightWrist[1]-headY)<30) return "HEAD_HOLD";
    return "STAND";
}

async function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    // 手势
    const hands = await handModel.estimateHands(video);
    if(hands.length>0){
        const gesture = detectHandGesture(hands[0].landmarks);
        if(gesture===currentAction) actionCounter++;
        else if(gesture){ currentAction=gesture; actionCounter=1; }
        else { currentAction=null; actionCounter=0; }

        const now = performance.now();
        if(currentAction && currentAction!==lastSentAction && actionCounter>=2 && now-lastSent>150){
            actionEl.textContent=currentAction;
            await sendAction(currentAction);
            lastSent=now;
            lastSentAction=currentAction;
        }else if(!currentAction && now-lastSent>300){
            actionEl.textContent="WAIT";
            lastSentAction=null;
        }
    }else{
        actionEl.textContent="没有检测到手";
        currentAction=null;
        actionCounter=0;
    }

    // 姿势
    const poses = await poseModel.estimatePoses(video);
    if(poses.length>0){
        const keypoints = poses[0].keypoints.map(k=>[k.x,k.y]);
        const posture = detectPosture(keypoints);
        postureEl.textContent = posture;

        if(posture===currentPosture) postureCounter++;
        else { currentPosture=posture; postureCounter=1; }

        if(postureCounter>=2 && performance.now()-lastSentPosture>150){
            let msg;
            switch(posture){
                case "STAND": msg="1"; break;
                case "SQUAT": msg="2"; break;
                case "HANDS_UP": msg="3"; break;
                case "HEAD_HOLD": msg="4"; break;
            }
            await sendPosture(msg);
            lastSentPosture=performance.now();
            console.log("Sent posture:",posture,msg);
        }
    }else{
        currentPosture=null;
        postureCounter=0;
        postureEl.textContent="No posture detected";
    }

    requestAnimationFrame(loop);
}

window.addEventListener("load",init);
</script>
</body>
</html>
